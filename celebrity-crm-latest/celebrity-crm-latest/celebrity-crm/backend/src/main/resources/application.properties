spring.application.name=celebrity_crm
server.port=8083

spring.config.import=optional:classpath:secrets.properties

spring.datasource.url=jdbc:mysql://localhost:3306/celebrity_crm?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

spring.session.jdbc.initialize-schema=always
spring.session.timeout=30d
server.servlet.session.cookie.max-age=365d
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

app.frontend-url=http://localhost:5173

app.admin.name=Admin
app.admin.email=admin@celebrity.local
app.admin.password=${APP_ADMIN_PASSWORD}
app.admin.mobile=${APP_ADMIN_MOBILE}

app.firebase.api-key=${FIREBASE_API_KEY}

app.google.client-id=${GOOGLE_CLIENT_ID}
app.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true